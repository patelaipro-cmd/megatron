name: tests
on: [push, pull_request]
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -t . -v
  domination-v1-experimental:
    if: github.head_ref == 'experiment/v1-domination-training-20261116' || github.ref == 'refs/heads/experiment/v1-domination-training-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check historical dataset integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('docs/experiences/EXP-009/variables.csv')
          assert p.is_file() and p.stat().st_size>0, 'EXP-009 variables.csv missing'
          expected='52ce2b08c769793f775a0a385b72b47fbf77bed3d4da2d1b29e562662fd94f6f'
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual==expected, f'SHA mismatch: {actual}'
          print('Verified historical dataset:',p.stat().st_size,'bytes')
          PY
      - name: Inventory historical V1 coverage
        run: PYTHONPATH=. python scripts/audit_domination_coverage.py --output artifacts/domination_v1/coverage.json
      - name: Pilot V1 historical features E0 2007-08
        run: PYTHONPATH=. python scripts/extend_domination_features.py --division E0 --season 2007/08 --output artifacts/domination_v1/*.csv
      - name: Expand V1 historical pilot to five leagues 2006-07
        run: |
          for division in E0 SP1 I1 F1 D1; do
            PYTHONPATH=. python scripts/extend_domination_features.py --division "$division" --season 2006/07 --allow-empty --output "artifacts/domination_v1/${division}_2006-07.csv"
          done
      - name: Replay frozen EXP-012 (no model promotion)
        run: python scripts/exp012_niveaux.py --sortie artifacts/domination_v1
      - name: Validate historical report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/domination_v1/resultats.json').read_text())
          assert d['effectifs']['test']>=1500
          for key in ['victoire_par_2_ou_plus','victoire_par_3_ou_plus']:
              x=d['niveaux'][key]
              print(key,'test:',x['test']['C']['n'],'logloss:',x['test']['C']['log_loss'],'p>=0.60:',x['test']['C']['tranche_p60'])
          print('Retrospective replay ONLY; no prospective validation, no deployment')
          PY
      - name: Audit confidence intervals and prevent premature GO
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p=Path('artifacts/domination_v1/resultats.json')
          d=json.loads(p.read_text())
          audit={'type':'retrospective_replay_not_prospective','decision':'NO_GO','levels':{}}
          for name in ('victoire_par_2_ou_plus','victoire_par_3_ou_plus'):
              v=d['niveaux'][name]['test']['C']['tranche_p60']
              n=v['n']; rate=v['frequence']; k=round(rate*n)
              z=1.959963984540054
              den=1+z*z/n
              center=(k/n+z*z/(2*n))/den
              half=z*math.sqrt((k/n)*(1-k/n)/n+z*z/(4*n*n))/den
              lo,hi=max(0,center-half),min(1,center+half)
              audit['levels'][name]={'n':n,'wins':k,'observed_rate':rate,'forecast_mean':v['p_moyenne'],'wilson95':[round(lo,4),round(hi,4)],'min_1500_p60':n>=1500,'lower_bound_above_60pct':lo>=0.60}
              print(name,audit['levels'][name])
          Path('artifacts/domination_v1/audit_p60.json').write_text(json.dumps(audit,indent=2,ensure_ascii=False)+'\\n')
          print('NO_GO: historical reused test period, no independent prospective cohort')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domination-v1-experimental-report
          path: |
            artifacts/domination_v1/*.json
            artifacts/domination_v1/E0_2007-08.csv
          if-no-files-found: warn
